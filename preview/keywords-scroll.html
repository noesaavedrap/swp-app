<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeywordsScroll Preview — SWP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background: #000; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { motion } = Motion;

    const KEYWORDS = [
      "RESULTADOS",
      "ENFOQUE",
      "ACCIÓN",
      "CRECIMIENTO",
      "DISCIPLINA",
      "MARKETING",
      "VENTAS",
      "LIDERAZGO",
      "CLIENTES",
    ];

    function KeywordsScroll() {
      const [index, setIndex] = useState(0);

      useEffect(() => {
        const interval = setInterval(() => {
          setIndex((prev) => (prev + 1) % KEYWORDS.length);
        }, 1800);
        return () => clearInterval(interval);
      }, []);

      const getWord = (offset) => {
        const i = (index + offset + KEYWORDS.length) % KEYWORDS.length;
        return KEYWORDS[i];
      };

      return (
        <section className="relative overflow-hidden bg-black min-h-screen flex flex-col items-center justify-center py-16">
          <div className="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_center,rgba(16,185,129,0.12),transparent_70%)]" />

          <p className="mb-10 text-center text-sm font-medium uppercase tracking-[0.25em] text-emerald-400">
            Lo que impulsa a las empresas que escalan
          </p>

          <div className="relative flex h-[300px] w-full max-w-3xl items-center justify-center">
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              {[-2, -1, 0, 1, 2].map((offset) => {
                const word = getWord(offset);
                const isActive = offset === 0;

                return (
                  <motion.div
                    key={`${word}-${index}-${offset}`}
                    initial={{ opacity: 0, y: offset * 20 }}
                    animate={{
                      opacity: isActive ? 1 : Math.max(0.12, 0.5 - Math.abs(offset) * 0.18),
                      y: offset * 58,
                      scale: isActive ? 1 : 0.9 - Math.abs(offset) * 0.05,
                      filter: isActive ? "blur(0px)" : `blur(${Math.abs(offset) * 4}px)`,
                    }}
                    transition={{
                      duration: 0.55,
                      ease: [0.25, 0.1, 0.25, 1],
                    }}
                    className="absolute flex items-center gap-4"
                  >
                    {isActive && (
                      <motion.span
                        initial={{ opacity: 0, x: -16 }}
                        animate={{ opacity: 1, x: 0 }}
                        transition={{ delay: 0.08, duration: 0.35 }}
                        className="text-3xl font-light text-white"
                      >
                        →
                      </motion.span>
                    )}
                    <span
                      className={`select-none text-5xl font-semibold tracking-tight md:text-7xl ${
                        isActive ? "text-white" : "text-white/60"
                      }`}
                    >
                      {word}
                    </span>
                  </motion.div>
                );
              })}
            </div>
          </div>

          <p className="mt-14 max-w-md text-center text-sm font-light leading-relaxed text-white/40 px-6">
            Resultados, enfoque y acción constante. Así construimos el crecimiento
            de las compañías que confían en SWP.
          </p>
        </section>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<KeywordsScroll />);
  </script>
</body>
</html>
