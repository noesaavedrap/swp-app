<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeywordsScroll Preview — SWP (Advanced)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background: #000; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;
    const { motion, AnimatePresence } = Motion;

    const KEYWORDS = [
      "RESULTADOS", "ENFOQUE", "ACCIÓN", "CRECIMIENTO", "DISCIPLINA",
      "MARKETING", "VENTAS", "LIDERAZGO", "CLIENTES",
    ];

    function KeywordsScroll() {
      const [index, setIndex] = useState(0);
      const [paused, setPaused] = useState(false);

      const next = useCallback(() => {
        setIndex((prev) => (prev + 1) % KEYWORDS.length);
      }, []);

      useEffect(() => {
        if (paused) return;
        const interval = setInterval(next, 2000);
        return () => clearInterval(interval);
      }, [paused, next]);

      const getWord = (offset) => {
        const i = (index + offset + KEYWORDS.length) % KEYWORDS.length;
        return KEYWORDS[i];
      };

      return (
        <section
          className="relative overflow-hidden bg-black min-h-screen flex flex-col items-center justify-center py-16"
          onMouseEnter={() => setPaused(true)}
          onMouseLeave={() => setPaused(false)}
        >
          <div className="pointer-events-none absolute inset-0">
            <div className="absolute left-1/2 top-1/2 h-[500px] w-[500px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-emerald-500/10 blur-[100px]" />
          </div>

          <p className="mb-12 text-center text-xs font-semibold uppercase tracking-[0.28em] text-emerald-400">
            Lo que impulsa a las empresas que escalan
          </p>

          <div className="relative flex h-[280px] w-full max-w-3xl items-center justify-center">
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              {[-2, -1, 0, 1, 2].map((offset) => {
                const word = getWord(offset);
                const isActive = offset === 0;
                const abs = Math.abs(offset);

                return (
                  <motion.div
                    key={`${index}-${offset}`}
                    initial={false}
                    animate={{
                      opacity: isActive ? 1 : Math.max(0.08, 0.45 - abs * 0.18),
                      y: offset * 58,
                      scale: isActive ? 1 : 0.88 - abs * 0.06,
                      filter: isActive ? "blur(0px)" : `blur(${abs * 4.5}px)`,
                    }}
                    transition={{ duration: 0.65, ease: [0.22, 1, 0.36, 1] }}
                    className="absolute flex items-center gap-4"
                  >
                    <AnimatePresence mode="wait">
                      {isActive && (
                        <motion.span
                          key="arrow"
                          initial={{ opacity: 0, x: -20, scale: 0.8 }}
                          animate={{ opacity: 1, x: 0, scale: 1 }}
                          exit={{ opacity: 0, x: -10 }}
                          transition={{ duration: 0.4 }}
                          className="text-3xl font-light text-emerald-400"
                        >
                          →
                        </motion.span>
                      )}
                    </AnimatePresence>

                    <span
                      className={`select-none text-5xl font-semibold tracking-tight md:text-7xl ${
                        isActive
                          ? "bg-gradient-to-r from-white via-white to-emerald-300 bg-clip-text text-transparent"
                          : "text-white/50"
                      }`}
                    >
                      {word}
                    </span>
                  </motion.div>
                );
              })}
            </div>
          </div>

          <div className="mt-10 flex items-center gap-2">
            {KEYWORDS.map((_, i) => (
              <button
                key={i}
                onClick={() => setIndex(i)}
                className="group relative flex h-6 w-6 items-center justify-center"
              >
                <span
                  className={`block h-1.5 rounded-full transition-all duration-500 ${
                    i === index ? "w-6 bg-emerald-500" : "w-1.5 bg-white/25 group-hover:bg-white/50"
                  }`}
                />
              </button>
            ))}
          </div>

          <p className="mt-12 max-w-md text-center text-sm font-light leading-relaxed text-white/40 px-6">
            Resultados, enfoque y acción constante.<br />
            Así construimos el crecimiento de las compañías que confían en SWP.
          </p>
        </section>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<KeywordsScroll />);
  </script>
</body>
</html>
